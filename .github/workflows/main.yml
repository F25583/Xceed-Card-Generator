name: Keep Streamlit App Awake

on:
  schedule:
    # يعمل يوميًا الساعة 7 صباحًا بتوقيت مصر (5 صباحًا بتوقيت جرينتش)
    - cron: '0 5 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to My Streamlit App
        run: |
          curl -I "https://xceed-card-generator-myi6rpwkcqphd4njlmx7lz.streamlit.app/"
